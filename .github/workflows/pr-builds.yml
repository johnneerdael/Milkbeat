name: Reviewed PR validation
run-name: 'Reviewed PR #${{ inputs.pr_number }} @ ${{ inputs.head_sha }} + ${{ inputs.base_sha }} = ${{ inputs.merge_sha }}'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR targeting main'
        required: true
        type: string
      head_sha:
        description: 'Reviewed head commit (40 hexadecimal characters)'
        required: true
        type: string
      base_sha:
        description: 'Main commit used by the test merge'
        required: true
        type: string
      merge_sha:
        description: 'Immutable test merge commit'
        required: true
        type: string

cache-mode: none

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: reviewed-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      merge_sha: ${{ steps.review.outputs.merge_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify review and immutable revision before builds
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD: ${{ inputs.head_sha }}
          PR_BASE: ${{ inputs.base_sha }}
          PR_MERGE: ${{ inputs.merge_sha }}
        run: python3 .github/scripts/review_gate.py preflight --pr "$PR_NUMBER"

  android:
    needs: preflight
    uses: ./.github/workflows/android-build.yml
    with:
      source_ref: ${{ needs.preflight.outputs.merge_sha }}
      pr_build: true
    # Deliberately pass no repository secrets to PR code.

  codeql:
    needs: preflight
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      source_ref: ${{ needs.preflight.outputs.merge_sha }}
      pr_number: ${{ inputs.pr_number }}

  metadata:
    needs: preflight
    uses: ./.github/workflows/pr-metadata.yml
    with:
      source_ref: ${{ needs.preflight.outputs.merge_sha }}
      pr_number: ${{ inputs.pr_number }}

  docs:
    needs: preflight
    uses: ./.github/workflows/docs.yml
    with:
      source_ref: ${{ needs.preflight.outputs.merge_sha }}
      pr_build: true

  result:
    if: always() && github.ref == 'refs/heads/main'
    needs: [preflight, android, codeql, metadata, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    concurrency:
      group: pr-review-controller
      queue: max
      cancel-in-progress: false
    steps:
      # A fresh runner and trusted main checkout; no PR artifacts are executed here.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Report only fully built, still reviewed PR revisions
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD: ${{ inputs.head_sha }}
          PR_BASE: ${{ inputs.base_sha }}
          PR_MERGE: ${{ inputs.merge_sha }}
          BUILD_RESULTS: '{"android":"${{ needs.android.result }}","codeql":"${{ needs.codeql.result }}","metadata":"${{ needs.metadata.result }}","docs":"${{ needs.docs.result }}"}'
        run: python3 .github/scripts/review_gate.py finish --pr "$PR_NUMBER"
