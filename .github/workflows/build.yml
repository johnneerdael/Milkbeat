name: Android CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [projectm-core-release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/android-build.yml
    with:
      pr_build: false
    secrets: inherit

  codeql:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  metadata:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-metadata.yml
    with:
      source_ref: ${{ github.sha }}
      pr_number: '0'

  docs:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      pr_build: false

  publish-main:
    name: Publish main build
    needs: [build, codeql, metadata, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: read

    steps:
      # Tags are needed to find the previous build for the changelog range.
      - name: Checkout history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release APKs
        uses: actions/download-artifact@v8
        with:
          pattern: milkbeat-*-release-apk
          path: dist/
          merge-multiple: true

      - name: Rename APKs for release
        run: |
          set -euo pipefail
          mv dist/app-github-universal-release.apk     dist/milkbeat-universal.apk
          mv dist/app-github-arm64-v8a-release.apk     dist/milkbeat-arm64-v8a.apk
          mv dist/app-github-armeabi-v7a-release.apk   dist/milkbeat-armeabi-v7a.apk
          # Downloader code 4718521 and older links point at the MusicViz-era name; keep serving it.
          cp dist/milkbeat-universal.apk dist/musicviz-universal.apk
          cd dist && sha256sum milkbeat*.apk > checksums.txt && cat checksums.txt

      # Each merged PR contributes its "## Release notes" section (validated by release-notes.yml);
      # the script appends the engine, install, plugin and changelog sections.
      - name: Write release notes from merged PRs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          CORE: ${{ needs.build.outputs.core_version }}
        run: |
          set -euo pipefail
          prev=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          python3 .github/scripts/release_notes.py generate \
            --checkout . --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
            --version "$VERSION" --previous-tag "$prev" --core-version "$CORE" --output notes.md
          cat notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Milkbeat v${{ needs.build.outputs.version }}
          body_path: notes.md
          make_latest: true
          files: |
            dist/milkbeat-universal.apk
            dist/milkbeat-arm64-v8a.apk
            dist/milkbeat-armeabi-v7a.apk
            dist/musicviz-universal.apk
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
