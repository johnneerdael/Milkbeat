name: Docs

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, edited, ready_for_review ]

permissions:
  contents: read

jobs:
  docs-updated:
    name: Check docs updated
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Install validator dependencies
        run: python3 -m pip install -r docs/site-requirements.txt
      - name: Test metadata and review policy
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Require a README or user guide update, or a reason in ## Docs
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
          python3 .github/scripts/pr_docs.py --event-file "$GITHUB_EVENT_PATH" --changed-files "$RUNNER_TEMP/changed.txt"
