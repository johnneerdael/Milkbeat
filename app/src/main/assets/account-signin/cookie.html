<!doctype html>
<html lang="{{lang}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>{{title}}</title>
<style>
:root{color-scheme:light dark}body{font:16px/1.5 system-ui,sans-serif;margin:0;padding:24px}main{max-width:44rem;margin:auto}label{display:block;font-weight:600;margin-top:1.5rem}input{box-sizing:border-box;width:100%;padding:.8rem;font:inherit}button{margin-top:1.5rem;padding:.8rem 1.4rem;font:inherit}li{margin:.6rem 0}.note{border-left:3px solid;padding-left:1rem}
</style></head><body><main>
<h1>{{title}}</h1>
<p class="note">{{warning}}</p>
<ol><li>{{open}} <a href="https://open.spotify.com/" target="_blank" rel="noopener noreferrer">{{spotify_link}}</a> {{open_suffix}}</li><li>{{find_storage}}</li><li>{{find_cookie}}</li></ol>
<form method="post" action="/submit" autocomplete="off">
<label for="code">{{pairing}}</label><input id="code" name="code" required autocomplete="off" spellcheck="false">
<label for="cookie">{{cookie}}</label><input id="cookie" name="cookie" type="password" required autocomplete="off" spellcheck="false">
<button type="submit">{{connect}}</button></form>
</main></body></html>
